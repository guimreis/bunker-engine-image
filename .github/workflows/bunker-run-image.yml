name: Build and Publish Bunker Run Image

on:
  push:
    branches:
      - bunker-7.24.0
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CAMUNDA_VERSION: "7.24.0"
  IMAGE_NAME: "bunker-engine-image"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build webapps frontend
        run: ./mvnw -B -pl webapps -am generate-resources

      - name: Build run distro (tests skipped)
        run: ./mvnw -B -Dmaven.test.skip=true -pl distro/run/distro -am package

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            -f docker/Dockerfile.run \
            --build-arg CAMUNDA_VERSION=${CAMUNDA_VERSION} \
            -t ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${CAMUNDA_VERSION}-bunker-run.${{ github.run_number }} \
            .

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${CAMUNDA_VERSION}-bunker-run.${{ github.run_number }}
